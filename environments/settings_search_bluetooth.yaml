id: settings.search.bluetooth
name: Search Settings for Bluetooth
app: com.apple.Preferences
difficulty: medium
tags:
- search
- typing
- capability:search-then-act
instruction: Open Settings, search for "Bluetooth" using the search field, and open the Bluetooth page
  from the results.
setup:
- terminate: com.apple.Preferences
- home
checks:
- kind: foreground_app
  text: com.apple.Preferences
- kind: element_exists
  text: Bluetooth
teardown:
- terminate: com.apple.Preferences
notes: Search results are a different surface from the settings list; acting on a result is the skill.
