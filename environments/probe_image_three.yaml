id: probe.image.three
name: Read the picture, panel three
app: com.apple.mobilesafari
difficulty: medium
tags:
- probe
- reading
- stratum:render
- capability:render-dependent
instruction: Open https://blolabel.ai/probe/three/ and tell me the word shown in the picture.
setup:
- terminate: com.apple.mobilesafari
- home
checks:
- kind: foreground_app
  text: com.apple.mobilesafari
- kind: answer_contains
  text: FULCRUM
teardown:
- terminate: com.apple.mobilesafari
notes: The word exists ONLY as pixels, verified absent from every accessibility node on the page while
  OCR reads it. One panel per page, so the stimulus is in the first screenful and the task measures perception
  rather than scrolling.
