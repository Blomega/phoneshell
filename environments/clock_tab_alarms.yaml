id: clock.tab.alarms
name: Switch to the Alarms tab
app: com.apple.mobiletimer
difficulty: easy
tags:
- tabs
- navigation
- capability:tabbar
instruction: Open the Clock app and switch to the Alarms tab.
setup:
- terminate: com.apple.mobiletimer
- home
checks:
- kind: foreground_app
  text: com.apple.mobiletimer
- kind: element_exists
  text: Alarms
teardown:
# Agents save the alarm despite being told not to, and 640 of them
# made a Clock tree read cost 2.6s. The suite undoes its own damage.
- clean_alarms
- terminate: com.apple.mobiletimer
